# hyprlock colours from pywal. Rendered per lock image by ~/.config/scripts/lock.sh
# (into ~/.cache/lock-wal/) and sourced by hyprlock.conf.
$lock_text   = rgba({foreground.strip}f2)
$lock_dim    = rgba({foreground.strip}cc)
$lock_accent = rgba({color11.strip}ff)
$lock_warn   = rgba({color11.strip}cc)
$lock_urgent = rgba({color1.strip}cc)
