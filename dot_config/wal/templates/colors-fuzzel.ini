# Fuzzel colors from pywal, matching the desktop menu:
# accent (color11) border and selection, surface (color0) behind the selected row.

[colors]
background = {background.strip}ff
text = {foreground.strip}ff
prompt = {color11.strip}ff
input = {foreground.strip}ff
placeholder = {color8.strip}ff
counter = {color8.strip}ff
match = {color11.strip}ff
selection = {color0.strip}ff
selection-text = {color11.strip}ff
selection-match = {color11.strip}ff
border = {color11.strip}ff
