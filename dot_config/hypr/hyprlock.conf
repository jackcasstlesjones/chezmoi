# Colours ($lock_*) come from a pywal palette made for the current lock image;
# ~/.config/scripts/lock.sh prepares both. Defaults first, in case it's missing.
$lock_text   = rgba(eceff4f2)
$lock_dim    = rgba(d8dee9cc)
$lock_accent = rgba(ebcb8bff)
$lock_warn   = rgba(ebcb8bcc)
$lock_urgent = rgba(bf616acc)
source = ~/.local/state/hypr/lock-colors.conf

general {
    disable_loading_bar = true
    grace = 0
    hide_cursor = true
    no_fade_in = false
    ignore_empty_input = true
}

auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning...
        retry_delay = 250 # in milliseconds
    }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 4, linear
    animation = fadeOut, 1, 2, linear
    # animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    # Symlink to the chosen image; set it from hypr-settings (Look → Lock screen)
    # or `wallpaper-theme.sh lock FILE`.
    path = ~/.local/state/hypr/lock-wallpaper
    # Blur and darken so the text stays readable on any image
    blur_passes = 2
    blur_size = 6
    brightness = 0.7
    noise = 0.06  # fine grain; the desktop blur uses 0.15, but hyprlock renders it coarser
}

# Main frosted glass card background
shape {
    monitor =
    size = 500, 700
    color = rgba(76, 86, 106, 0)
    rounding = 20
    # border_size = 2
    # border_color = rgba(136, 192, 208, 0.3)
    rotate = 0
    position = 0, 0
    halign = center
    valign = center
    # shadow_passes = 4
    # shadow_size = 10
    # shadow_color = rgba(0, 0, 0, 0.5)
}

