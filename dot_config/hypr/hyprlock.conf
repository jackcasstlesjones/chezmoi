# Time display (large)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    color = $lock_accent
    font_size = 240
    font_family = JetBrains Mono Bold
    position = 0, 140
    halign = center
    valign = center
    # shadow_passes = 2
    # shadow_size = 4
    # shadow_color = rgba(0, 0, 0, 0.5)
}

# Date display
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = $lock_dim
    font_size = 20
    font_family = JetBrains Mono Medium
    position = 0, -200
    halign = center
    valign = center
}

# User greeting
label {
    monitor =
    # text = Welcome back, $USER
    text = 
    color = $lock_text
    font_size = 24
    font_family = JetBrains Mono Medium
    position = 0, 0
    halign = center
    valign = center
}

# Password input field (styled to match the card)
input-field {
    monitor =
    size = 350, 60
    position = 0, -120
    halign = center
    valign = center
    rounding = 12
    dots_center = true
    dots_spacing = 0.3
    dots_rounding = -1
    fade_on_empty = false
    fade_timeout = 2000
    font_color = $lock_text
    font_family = JetBrains Mono
    inner_color = rgba(67, 76, 94, 0)
    outer_color = rgba(136, 192, 208, 0)
    outline_thickness = 0
    placeholder_text = 
    placeholder_color = $lock_dim
    # shadow_passes = 2
    # shadow_size = 4
    # shadow_color = rgba(0, 0, 0, 0.3)
    fail_color = rgba(216,222,233, 0)
    fail_text = $FAIL ($ATTEMPTS)
    check_color = rgba(216,222,233, 0)
    capslock_color = $lock_warn
    numlock_color = $lock_warn
    bothlock_color = $lock_urgent
    invert_numlock = false
    swap_font_color = false
}


