# Styled to match the desktop right-click menu (~/.local/bin/desktop-menu):
# JetBrains Mono, square 2px corners, 3px accent border, accent-coloured selection.
# Colours come from pywal: ~/.config/wal/templates/colors-fuzzel.ini

[main]
include = ~/.cache/wal/colors-fuzzel.ini
terminal = kitty
exit-on-keyboard-focus-loss = yes

# Font Awesome is a fallback so the prompt can use its magnifying-glass glyph
font = JetBrains Mono:size=11,Font Awesome 7 Free:style=Solid:size=11
prompt = "  "
placeholder = Search…
use-bold = yes
# Size fonts by fontconfig, not monitor DPI: with DPI sizing the first frame used the
# laptop panel's DPI and flashed ~1.6x too big before shrinking on the external monitor.
dpi-aware = no

width = 38
lines = 10
line-height = 30
horizontal-pad = 14
vertical-pad = 12
inner-pad = 10
icons-enabled = no
image-size-ratio = 0

[border]
width = 3
# Must stay 0: with a radius, fuzzel 1.15 paints the padding in the border colour
radius = 0
selection-radius = 2

[dmenu]
exit-immediately-if-empty = no
