font_family JetBrains Mono
dynamic_background_opacity yes
window_padding_width 2 
font_size 10

# Colours generated by pywal
include ~/.cache/wal/colors-kitty.conf
include ~/.cache/wal/colors-kitty-extras.conf

# Open new OS window in current directory (Super+N)
 map super+n launch --type=os-window --cwd=current

# map super+n new_window_with_cwd

# Per-instance control socket (user-only runtime dir), used by
# ~/.config/scripts/yazi-cwd.sh to read the focused window's cwd
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}.sock

cursor_shape block
shell_integration no-cursor
